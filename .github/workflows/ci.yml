name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Third-party action pinned by commit SHA (tags can be moved).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: make lint
      - run: make test

  docker:
    runs-on: ubuntu-24.04
    # Build, slow tests with real DVD encodes (about 1 min locally) and the end-to-end smoke.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compose refuses to start without host paths
        run: |
          if out=$(docker compose config 2>&1); then
            echo "docker-compose.yml must require the HOST_* variables"
            exit 1
          fi
          echo "$out" | grep -q "set HOST_MEDIA_DIR in .env"

      - name: Integration tests inside the image (no network)
        run: make test-slow

      - name: Create test environment
        run: |
          mkdir -p "/tmp/ci/media/Disco Teste" /tmp/ci/work /tmp/ci/output
          echo "not a video" > "/tmp/ci/media/Disco Teste/x.mkv"
          # The app runs as uid 1000 and the runner user is 1001: hand the folders over.
          sudo chown 1000:1000 /tmp/ci/work /tmp/ci/output
          printf 'HOST_MEDIA_DIR=/tmp/ci/media\nHOST_WORK_DIR=/tmp/ci/work\nHOST_OUTPUT_DIR=/tmp/ci/output\n' > .env

      # --wait only on web: newer compose versions fail --wait on a service without healthcheck.
      - name: Build and start (waits for the healthcheck)
        run: |
          docker compose up -d --build worker
          docker compose up -d --wait --wait-timeout 120 web

      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/ -o index.html
          grep -q "Disco Teste" index.html
          curl -fsS -X POST "http://127.0.0.1:8000/folders/Disco%20Teste/scan" -o scan.html
          grep -q "Não foi possível ler o arquivo" scan.html
          curl -fsS http://127.0.0.1:8000/static/app.css | grep -q -- "--accent"
          curl -fsS "http://127.0.0.1:8000/folders/Disco%20Teste" -o folder.html
          grep -q "Curadoria desligada" folder.html  # no token in CI
          grep -q "Este produto usa a API do TMDB" folder.html
          curl -fsS http://127.0.0.1:8000/static/tmdb.svg | grep -q "<svg"
          curl -fsS http://127.0.0.1:8000/health -o health.json
          cat health.json
          jq -e '.status == "ok" and ([.tools[]] | length == 7 and all(. != null))' health.json
          # Assign first: a failing command inside $(...) passed to test would not stop the step.
          uid="$(docker compose exec -T web id -u)"
          test "$uid" -ne 0
          docker compose exec -T web touch /work/ci-check /output/ci-check /data/ci-check
          # The input folder must be mounted read-only. Check the mount itself: a failing
          # touch would also pass when only the folder permissions (runner uid 1001) block it.
          media_options="$(docker compose exec -T web awk '$2 == "/media" { print $4 }' /proc/mounts)"
          echo "/media mount options: $media_options"
          echo "$media_options" | grep -qE '^ro(,|$)'

      - name: Generate a DVD end to end (web + worker)
        run: |
          mkdir -p "/tmp/ci/media/Disco DVD"
          chmod 777 "/tmp/ci/media/Disco DVD"
          docker compose run --rm --no-deps -T -v "/tmp/ci/media/Disco DVD:/gen" \
            --entrypoint ffmpeg web -nostdin -v error \
            -f lavfi -i testsrc2=s=1280x720:r=24000/1001:d=3 -f lavfi -i sine=d=3 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac \
            -metadata:s:a:0 language=por /gen/clip.mkv
          base=http://127.0.0.1:8000
          curl -fsS -X POST -H "Sec-Fetch-Site: same-origin" "$base/folders/Disco%20DVD/scan" -o /dev/null
          curl -fsS "$base/folders/Disco%20DVD/dvd" | grep -q "Montar DVD"
          curl -fsS "$base/folders/Disco%20DVD/dvd/menu.png?page=0" -o menu.png
          head -c 4 menu.png | grep -q "PNG"
          job="$(curl -fsS -o /dev/null -w '%{redirect_url}' -X POST \
            -H "Sec-Fetch-Site: same-origin" \
            -d kind=movies --data-urlencode "order=Disco DVD/clip.mkv" -d profile=dvd5 \
            -d audio=pt -d first_audio=pt -d chapters=every -d minutes=5 -d subtitle_on= \
            -d backdrop= -d accent=auto -d side=left "$base/folders/Disco%20DVD/dvd")"
          echo "job: $job"
          test -n "$job"
          for _ in $(seq 90); do
            status="$(curl -fsS "$job/status")"
            if echo "$status" | grep -q "Pronto!"; then break; fi
            if echo "$status" | grep -qE "banner-error|Cancelado"; then echo "$status"; exit 1; fi
            sleep 2
          done
          echo "$status" | grep -q "Pronto!"
          iso="/tmp/ci/output/iso/Disco DVD.iso"
          test -s "$iso"
          test "$(stat -c %u "$iso")" -eq 1000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs web worker || true
