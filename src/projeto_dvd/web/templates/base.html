<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca{% endblock %} · projeto-dvd</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <main class="page">
    <nav class="nav" aria-label="Seções">
      <a href="{{ url_for('library') }}">Biblioteca</a>
      <a href="{{ url_for('jobs') }}">Jobs</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
  <footer class="credits muted">
    <a href="https://www.themoviedb.org/"><img src="{{ url_for('static', path='tmdb.svg') }}" alt="TMDB" width="91" height="12"></a>
    <span>Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</span>
  </footer>
</body>
</html>
