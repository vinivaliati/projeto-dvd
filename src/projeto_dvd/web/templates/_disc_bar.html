<div id="disc-bar" class="disc-bar" aria-live="polite"{% if oob %} hx-swap-oob="true"{% endif %}>
  <span class="numbers">{{ chosen.profile.name }} · <span class="quality quality-{{ {'Ótima': 'great', 'Aceitável': 'ok', 'Baixa': 'low', 'Não cabe': 'none'}[chosen.quality] }}">{{ chosen.quality }}</span> · vídeo a {{ "%.1f" | format(chosen.video_kbps / 1000) | replace(".", ",") }} Mbps</span>
  <a href="#profiles">Ver disco</a>
</div>
