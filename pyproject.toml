[project]
name = "projeto-dvd"
version = "0.1.0"
description = "Turn a personal movie and TV collection into authored DVD and Blu-ray discs with menus and printable covers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Plans and specs are historical documents, not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=projeto_dvd --cov-report=term-missing --cov-fail-under=90"
markers = ["slow: integration tests that build real discs (run inside the Docker image)"]
