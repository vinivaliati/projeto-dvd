[project]
name = "projeto-dvd"
version = "0.1.0"
description = "Turn a personal movie and TV collection into authored DVD and Blu-ray discs with menus and printable covers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Plans and specs are historical documents, not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "not slow" by default; "-m slow" on the command line wins (last -m applies).
addopts = "--strict-markers -m 'not slow' --cov=projeto_dvd --cov-branch --cov-report=term-missing --cov-fail-under=90"
markers = ["slow: integration tests that need the media toolchain (run inside the Docker image)"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
